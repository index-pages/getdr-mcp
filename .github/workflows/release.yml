name: release

on:
  push:
    tags: ["v*"]

# npm trusted publishing and the MCP Registry: the OIDC token replaces any
# secret.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The backend tests build getdr and its mock server from source; the
      # repos are released together, so the same tag is checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: index-pages/getdr
          ref: ${{ github.ref_name }}
          path: getdr-src
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: getdr-src/go.mod
          cache: false
      # Node 24 ships npm 11, which trusted publishing needs (>= 11.5.1).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
        env:
          GETDR_SRC: ${{ github.workspace }}/getdr-src
      # Versions in package.json, server.json and the build match the tag;
      # the packed tarball holds dist/index.js with its shebang.
      - run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      # A version already on npm (e.g. a manual first publish) is not an error.
      - run: |
          if npm view "getdr-mcp@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "getdr-mcp@${GITHUB_REF_NAME#v} is already on npm, skipping publish"
          else
            npm publish --provenance --access public --ignore-scripts
          fi
      # The MCP Registry checks mcpName in the npm package, so it waits until
      # npm shows the new version. The namespace io.github.index-pages is
      # proven by this workflow's OIDC token. mcp-publisher is pinned by
      # version and SHA-256.
      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          v=${GITHUB_REF_NAME#v}
          if curl -fsS -m 30 -o /dev/null "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.index-pages%2Fgetdr-mcp/versions/$v"; then
            echo "getdr-mcp $v is already in the MCP Registry, skipping"
            exit 0
          fi
          for i in $(seq 30); do
            npm view "getdr-mcp@$v" version >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "getdr-mcp@$v is not on npm after 5 minutes" >&2; exit 1; }
            sleep 10
          done
          curl -fsSL -m 120 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
